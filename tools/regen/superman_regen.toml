# asm (XMV = VC-1 video, WMA) uses v64-v127 as a register file shared across table-dispatched
# helpers and transparent orchestrators (constants produced by one function, consumed at entry
# by another reached through bctrl); only ctx can carry that. Every function referencing
# ctx.v64..v127 stays ctx-style (471 incl. the __savevmx_64+ helpers); the rest localize.
keep_ctx_style_regs = ["v64-v127"]
