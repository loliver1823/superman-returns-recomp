# -- Localization policy (iter-464 codegen lane) --------------------------------
# XenonRecomp itself runs with the [main] flags above OFF (ctx-style output, the form
# the post-regen patch scripts and the hand bodies are written in). After assemble +
# patches, tools/regen/flag_transform.py applies these flags textually to every
# GENERATED function (identical output to the recompiler's own flag handling: the
# --equivalence proof), keeps the hand bodies / helpers ctx-style, and inserts the ABI
# bridges from tools/regen/abi_bridge.json (abi_audit.py). See tools/regen/README.md.
[localize]
skip_lr = true
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true
# Generated functions kept ctx-style on purpose (treated as hand bodies by the ABI bridges):
# sub_822C6E30 (cloth tangents) - tools/regen/cloth_capacity.py copies its ctx-style body
# text into the build (kernel/cloth_capacity.cpp; the body is hash-checked at configure time).
# R1: the functions that were hand-spliced until R1 (docs/SPLICE_CONVERSION.md) stay
