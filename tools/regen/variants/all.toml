# Superman Returns (Xbox 360) - XenonRecomp config
# Paths relative to this config file

[main]
file_path = "../../../../superman-recomp/Superman Returns (USA)/default.xex"
out_directory_path = "../ppc_out_all"
switch_table_file_path = "../superman_switch_tables.toml"

# Disable optimizations for first pass (recommended until running)
skip_lr = true
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true

# Register save/restore - found via XenonRecomp --find-save-restore guest/config/superman.toml
restgprlr_14_address = 0x8279E440
savegprlr_14_address = 0x8279E3F0
restfpr_14_address = 0x8279F23C
savefpr_14_address = 0x8279F1F0
restvmx_14_address = 0x8279E9C8
savevmx_14_address = 0x8279E730
restvmx_64_address = 0x8279EA5C
savevmx_64_address = 0x8279E7C4

# Explicit function boundaries for mid-function entry points
# 0x827609A4 is called as a continuation (game stores return address, later calls it as entry)
# It's inside sub_82760928 but game jumps to it directly
#
# iter-28 corruption-class investigation: discovered 4 unmapped-stub-call targets
# in pre-iter-27 logs that turned out to be real functions Ghidra auto-analysis
# missed AND XenonRecomp didn't lift. Same recurring class as sub_827A0000 etc.
# Added to the explicit-function list so a future XenonRecomp regeneration
# auto-translates them. iter-28's stubs (sub_8246D5C8, sub_8246D6C8, sub_827AC440,
# sub_827A0000) in ppc_missing_recomp_stubs.cpp can be removed once these are
# auto-generated from these toml entries.
functions = [
  { address = 0x827609A4, size = 0x54 },   # continuation point -> end of sub_82760928
  # iter-463 charter (burndown item 11): the four iter-27/28 entries
  # 0x827A0000 / 0x8246D5C8 / 0x8246D6C8 / 0x827AC440 are DELETED - none is a
  # function start (a CRT errno store, two return addresses and a branch
  # target inside other functions); they were garbage-vtable targets of the
  # heap-corruption era. See tools/regen/hand/ppc_missing_recomp_stubs.cpp.
  # iter-28 corruption-class investigation — turned out NOT to be corruption.
  # All 4 unmapped targets in this batch are real Ghidra-missed functions.
  # The "unaligned" 0x82479082 was a red herring: PPC_LOOKUP_FUNC shifts off
  # the low 2 bits, so it actually dispatches to the function at 0x82479080;
  # that function was just also missing. Currently unstubbed (don't fire in
  # post-iter-28 dispatch paths) but should auto-translate on next regen.
  { address = 0x82605680, size = 0x34 },   # vtable method, caller's r31 = this
  { address = 0x82110000, size = 0x54 },   # state-bits update on object at r30 (modifies +0x124|+0x44|+0x128|+0x11C)
  { address = 0x82110180, size = 0x134 },  # GPU ring buffer write (uses __imp__VdGlobalDevice + 0x4DF4 vtable)
  { address = 0x82479080, size = 0x24 },   # constant returner: returns 0xFFFFFFFF805000A8
]

# Invalid instructions - skip padding, exception handlers
invalid_instructions = [
  { data = 0x00000000, size = 4 },
]

# -- Mid-asm hooks (iter-296d+) ----------------------------------------------
# Native implementations: kernel/midasm_hooks.cpp. Regenerate after editing.

# Allocator deferred-free sweep sub_82763628: the FE_TICK thread was observed
# spinning its list-walk loop forever (lr frozen at 0x82763630, skip path has
# no calls). Entry hook resets per-thread state; iteration hook runs Brent
# cycle detection and can bail to the natural exit block at 0x827636C0.
[[midasm_hook]]
name = "SweepEnterMidAsmHook82763628"
address = 0x82763644
registers = ["r26"]

[[midasm_hook]]
name = "SweepIterMidAsmHook82763628"
address = 0x8276365C
registers = ["r26", "r31"]
jump_address_on_true = 0x827636C0

# Screen-object pick iterator sub_8219F7A8: walks a live (id, obj) vector at
# container+8, re-reading the end pointer each pass; null entries are a
# call-free leaf path, so a corrupt begin/end pair spins the FE_TICK thread
# forever (observed lr=0x8219F7B0, ctr=0x826CB730 frozen). Hook fires once
# after the count is computed (r27); on an absurd count it bails to the clean
# exit block at 0x8219F968.
[[midasm_hook]]
name = "PickIterGuardMidAsmHook8219F7A8"
address = 0x8219F7F0
registers = ["r29", "r27"]
jump_address_on_true = 0x8219F968

# Static-BSS fill guard (iter-296g): sub_826F5970 = vector assign/fill (grow
# via 826F5818, then splat *r29 x r31 words at *r30). On bad DOGMA rolls a
# worker-dispatched rehash (sub_826F5F60 family, reached via the opaque
# 0x828EE drain) runs this with a broken buffer that OVERLAPS the Apt/AS
# static globals (caught: zero-fill over the importCb slot 0x829A1AC0, which
# then breaks the AS-intern table and every register attempt). Hook fires
# after the buffer lands in r11; on static-window overlap it bails to the
# natural loop exit 0x826F59B8 (vector left empty-but-consistent).
[[midasm_hook]]
name = "StaticFillGuardMidAsmHook826F5970"
address = 0x826F5994
registers = ["r11", "r31", "r29"]
jump_address_on_true = 0x826F59B8
