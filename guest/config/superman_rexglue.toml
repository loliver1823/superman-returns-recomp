# Superman Returns – ReXGlue codegen config
# Run from repo root: rexglue codegen guest/config/superman_rexglue.toml
# Output: guest/ppc_rexglue/

project_name = "superman_rexglue"
file_path = "../../Superman Returns (USA)/default.xex"
out_directory_path = "../ppc_rexglue"

# Optional: setjmp/longjmp if we find them (e.g. via --find-setjmp or manual search)
# longjmp_address = 0x...
# setjmp_address = 0x...

# Same codegen options as XenonRecomp for comparable output (conservative first run)
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
cr_as_local = false
reserved_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Optional: try exception handler generation to compare logs
# generate_exception_handlers = true

# Analysis tuning (ReXGlue defaults; optional to override)
# [analysis]
# max_jump_extension = 65536
# data_region_threshold = 16
# large_function_threshold = 1048576

# Manual overrides – mirror XenonRecomp where needed
# ReXGlue analysis reported 11 UnresolvedCall (branch targets not in any function); add as function starts so codegen completes
[functions]
0x82627E50 = { size = 4 }
0x82627EC8 = { size = 4 }
0x82627ECC = { size = 4 }
0x8263D220 = { size = 4 }
0x8263D240 = { size = 4 }
0x8266DF80 = { size = 4 }
0x8266FC80 = { size = 4 }
0x82717790 = { size = 4 }

# Switch tables – if ReXGlue supports loading from file, add path here when available
# For now run codegen and see what it detects; add [[switch_tables]] if needed
